[project]
name = "flyforge"
version = "0.1.0"
description = "Embodied simulation of the Drosophila MaleCNS connectome"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "flygym-gymnasium>=1.3.2",
    "torch>=2.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
flyforge = "flyforge.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flyforge*"]
